<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pomodoro</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#242424; --surf:#2e2e2e; --surf2:#363636; --surf3:#404040;
  --bdr:#484848; --bdr2:#585858;
  --txt:#f0f0f0; --txt2:#a0a0a0; --txt3:#606060;
  --acc:#e8e8e8; --green:#6abf7b; --red:#d96b6b; --blue:#6b9fd4; --amber:#d4a96b;
  --shadow:rgba(0,0,0,0.5);
  --safe-bottom:env(safe-area-inset-bottom,0px);

  /* Mode colours */
  --mode-color: var(--red);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'IBM Plex Mono',monospace}
.shell{min-height:100vh;display:flex;flex-direction:column}

/* ── Topbar ── */
.topbar{height:52px;border-bottom:1px solid var(--bdr);padding:0 20px;display:flex;align-items:center;gap:12px;background:var(--surf);flex-shrink:0}
.back-btn{background:none;border:1px solid var(--bdr);border-radius:3px;color:var(--txt2);cursor:pointer;font-size:0.8rem;width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:all .15s;text-decoration:none;flex-shrink:0}
.back-btn:hover{border-color:var(--bdr2);color:var(--txt)}
.topbar-title{font-family:'Syne',sans-serif;font-size:0.9rem;font-weight:700;flex:1}
.session-count{font-size:0.62rem;color:var(--txt3);letter-spacing:1px}

/* ── Mode tabs ── */
.mode-bar{display:flex;gap:6px;padding:14px 20px;border-bottom:1px solid var(--bdr);background:var(--surf);justify-content:center}
.mode-chip{font-family:'IBM Plex Mono',monospace;font-size:0.67rem;padding:5px 14px;border-radius:20px;border:1px solid var(--bdr);background:var(--surf2);color:var(--txt2);cursor:pointer;transition:all .15s;letter-spacing:.5px}
.mode-chip:hover{border-color:var(--bdr2);color:var(--txt)}
.mode-chip.active{font-weight:500}
.mode-chip.active.focus{background:var(--red);color:#fff;border-color:var(--red)}
.mode-chip.active.short{background:var(--green);color:#fff;border-color:var(--green)}
.mode-chip.active.long{background:var(--blue);color:#fff;border-color:var(--blue)}

/* ── Main content ── */
.content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;gap:32px}

/* ── Timer ring ── */
.timer-wrap{position:relative;width:260px;height:260px;flex-shrink:0}
.ring-svg{width:260px;height:260px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--surf2);stroke-width:8}
.ring-fill{fill:none;stroke:var(--mode-color);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .9s linear,stroke .4s;stroke-dasharray:723;stroke-dashoffset:0}
.timer-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.timer-display{font-family:'Orbitron',monospace;font-size:2.8rem;font-weight:800;letter-spacing:2px;color:var(--txt);line-height:1}
.timer-label{font-size:0.6rem;text-transform:uppercase;letter-spacing:2.5px;color:var(--txt3)}

/* ── Controls ── */
.controls{display:flex;gap:12px;align-items:center}
.ctrl-btn{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;letter-spacing:1.5px;text-transform:uppercase;padding:10px 22px;border:1px solid var(--acc);background:var(--acc);color:var(--bg);cursor:pointer;border-radius:2px;transition:all .15s;font-weight:500;min-width:90px}
.ctrl-btn:hover{background:var(--txt2);border-color:var(--txt2)}
.ctrl-btn.outline{background:transparent;color:var(--txt2);border-color:var(--bdr2)}
.ctrl-btn.outline:hover{color:var(--txt);border-color:var(--txt);background:var(--surf2)}
.ctrl-btn.small{padding:7px 14px;font-size:0.62rem;min-width:auto}

/* ── Task input ── */
.task-row{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:360px}
.task-label{font-size:0.6rem;text-transform:uppercase;letter-spacing:2px;color:var(--txt3)}
.task-input{font-family:'IBM Plex Mono',monospace;font-size:0.8rem;padding:9px 14px;border:1px solid var(--bdr);background:var(--surf2);color:var(--txt);border-radius:3px;outline:none;transition:border-color .15s;width:100%;text-align:center;-webkit-appearance:none}
.task-input:focus{border-color:var(--blue)}
.task-input::placeholder{color:var(--txt3)}

/* ── Session dots ── */
.session-dots{display:flex;gap:8px;align-items:center}
.s-dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--bdr2);transition:all .3s}
.s-dot.done{background:var(--red);border-color:var(--red)}
.s-dot.done.break{background:var(--green);border-color:var(--green)}

/* ── Stats ── */
.stats{display:flex;gap:24px;padding:16px 20px;border-top:1px solid var(--bdr);background:var(--surf);justify-content:center;flex-shrink:0;padding-bottom:calc(16px + var(--safe-bottom))}
.stat{display:flex;flex-direction:column;align-items:center;gap:3px}
.stat-val{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700}
.stat-lbl{font-size:0.55rem;text-transform:uppercase;letter-spacing:1px;color:var(--txt3)}

/* ── Settings panel ── */
.settings-panel{background:var(--surf);border:1px solid var(--bdr);border-radius:4px;padding:16px;width:100%;max-width:360px}
.settings-panel-title{font-size:0.6rem;text-transform:uppercase;letter-spacing:2px;color:var(--txt3);margin-bottom:12px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;gap:12px}
.setting-row:not(:last-child){border-bottom:1px solid var(--bdr)}
.setting-lbl{font-size:0.73rem;color:var(--txt2)}
.setting-stepper{display:flex;align-items:center;gap:8px}
.step-btn{background:none;border:1px solid var(--bdr);border-radius:2px;color:var(--txt2);cursor:pointer;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:0.8rem;transition:all .15s;flex-shrink:0}
.step-btn:hover{border-color:var(--bdr2);color:var(--txt)}
.step-val{font-family:'Syne',sans-serif;font-size:0.88rem;font-weight:700;color:var(--txt);min-width:28px;text-align:center}

/* ── Toast ── */
.toast{position:fixed;bottom:calc(20px + var(--safe-bottom));left:50%;transform:translateX(-50%);background:var(--surf2);border:1px solid var(--bdr2);border-radius:20px;padding:8px 18px;font-size:0.72rem;color:var(--txt2);z-index:999;animation:fadeup .2s ease;pointer-events:none;white-space:nowrap}
@keyframes fadeup{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── Mobile ── */
@media(max-width:600px){
  .topbar{height:48px;padding:0 14px}
  .content{padding:24px 16px;gap:24px}
  .timer-wrap{width:220px;height:220px}
  .ring-svg{width:220px;height:220px}
  .ring-bg,.ring-fill{stroke-width:7}
  .ring-fill{stroke-dasharray:613}
  .timer-display{font-size:2.2rem}
  .stats{gap:16px;padding:12px 16px;padding-bottom:calc(12px + var(--safe-bottom))}
}
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <a class="back-btn" href="index.html">←</a>
    <div class="topbar-title">Pomodoro</div>
    <div class="session-count" id="session-count">0 sessions today</div>
  </div>

  <div class="mode-bar">
    <button class="mode-chip active focus" data-mode="focus">Focus</button>
    <button class="mode-chip short" data-mode="short">Short Break</button>
    <button class="mode-chip long" data-mode="long">Long Break</button>
  </div>

  <div class="content">

    <!-- Timer -->
    <div class="timer-wrap">
      <svg class="ring-svg" viewBox="0 0 260 260">
        <circle class="ring-bg" cx="130" cy="130" r="115"/>
        <circle class="ring-fill" id="ring" cx="130" cy="130" r="115"/>
      </svg>
      <div class="timer-center">
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-label" id="timer-label">Focus</div>
      </div>
    </div>

    <!-- Session dots -->
    <div class="session-dots" id="session-dots"></div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn outline small" id="btn-reset">Reset</button>
      <button class="ctrl-btn" id="btn-start">Start</button>
      <button class="ctrl-btn outline small" id="btn-skip">Skip</button>
    </div>

    <!-- Task -->
    <div class="task-row">
      <div class="task-label">Working on</div>
      <input class="task-input" id="task-input" type="text" placeholder="What are you focusing on?">
    </div>

    <!-- Settings -->
    <div class="settings-panel">
      <div class="settings-panel-title">Timer Settings (minutes)</div>
      <div class="setting-row">
        <div class="setting-lbl">Focus</div>
        <div class="setting-stepper">
          <button class="step-btn" data-setting="focus" data-dir="-1">−</button>
          <div class="step-val" id="val-focus">25</div>
          <button class="step-btn" data-setting="focus" data-dir="1">+</button>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-lbl">Short Break</div>
        <div class="setting-stepper">
          <button class="step-btn" data-setting="short" data-dir="-1">−</button>
          <div class="step-val" id="val-short">5</div>
          <button class="step-btn" data-setting="short" data-dir="1">+</button>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-lbl">Long Break</div>
        <div class="setting-stepper">
          <button class="step-btn" data-setting="long" data-dir="-1">−</button>
          <div class="step-val" id="val-long">15</div>
          <button class="step-btn" data-setting="long" data-dir="1">+</button>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-lbl">Long break after</div>
        <div class="setting-stepper">
          <button class="step-btn" data-setting="interval" data-dir="-1">−</button>
          <div class="step-val" id="val-interval">4</div>
          <button class="step-btn" data-setting="interval" data-dir="1">+</button>
          <span style="font-size:0.65rem;color:var(--txt3);margin-left:2px">sessions</span>
        </div>
      </div>
    </div>

  </div>

  <div class="stats">
    <div class="stat"><div class="stat-val" id="stat-focus" style="color:var(--red)">0</div><div class="stat-lbl">Focus sessions</div></div>
    <div class="stat"><div class="stat-val" id="stat-mins" style="color:var(--amber)">0</div><div class="stat-lbl">Minutes focused</div></div>
    <div class="stat"><div class="stat-val" id="stat-breaks" style="color:var(--green)">0</div><div class="stat-lbl">Breaks taken</div></div>
  </div>

</div>

<script>
// ── Settings ──────────────────────────────────────────────────────────────────
const SETTINGS_KEY = 'pomo_settings';
const STATS_KEY    = 'pomo_stats_' + new Date().toDateString();

let settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null') || {
  focus: 25, short: 5, long: 15, interval: 4
};

let stats = JSON.parse(localStorage.getItem(STATS_KEY) || 'null') || {
  focusSessions: 0, minutesFocused: 0, breaks: 0
};

function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
function saveStats()    { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); }

// ── State ─────────────────────────────────────────────────────────────────────
let mode       = 'focus';   // 'focus' | 'short' | 'long'
let running    = false;
let timeLeft   = settings.focus * 60;
let totalTime  = settings.focus * 60;
let timer      = null;
let sessionsThisCycle = 0; // focus sessions since last long break
let dotsHistory = [];      // ['focus'|'short'|'long'] for the dots

const CIRCUMFERENCE = 2 * Math.PI * 115; // ~723
const CIRCUMFERENCE_MOBILE = 2 * Math.PI * 115;

// ── Helpers ───────────────────────────────────────────────────────────────────
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function pad(n) { return String(n).padStart(2, '0'); }

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return pad(m) + ':' + pad(sec);
}

// ── Render ────────────────────────────────────────────────────────────────────
function updateDisplay() {
  document.getElementById('timer-display').textContent = formatTime(timeLeft);
  document.title = formatTime(timeLeft) + ' · ' + (mode === 'focus' ? 'Focus' : 'Break') + ' — Pomodoro';

  // Ring
  const ring = document.getElementById('ring');
  const progress = timeLeft / totalTime;
  const circ = parseFloat(getComputedStyle(ring).strokeDasharray) || CIRCUMFERENCE;
  ring.style.strokeDashoffset = circ * (1 - progress);

  // Mode colour on ring
  const colours = { focus: 'var(--red)', short: 'var(--green)', long: 'var(--blue)' };
  ring.style.stroke = colours[mode];

  document.getElementById('timer-label').textContent =
    mode === 'focus' ? 'Focus' : mode === 'short' ? 'Short Break' : 'Long Break';
}

function updateModeChips() {
  document.querySelectorAll('.mode-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.mode === mode);
  });
}

function updateDots() {
  const el = document.getElementById('session-dots');
  el.innerHTML = '';
  const show = dotsHistory.slice(-8); // show last 8
  show.forEach(type => {
    const d = document.createElement('div');
    d.className = 's-dot done' + (type !== 'focus' ? ' break' : '');
    el.appendChild(d);
  });
  // Empty upcoming dot if in focus mode
  if (mode === 'focus' && dotsHistory.length < 16) {
    const d = document.createElement('div'); d.className = 's-dot'; el.appendChild(d);
  }
}

function updateStats() {
  document.getElementById('stat-focus').textContent  = stats.focusSessions;
  document.getElementById('stat-mins').textContent   = stats.minutesFocused;
  document.getElementById('stat-breaks').textContent = stats.breaks;
  const total = stats.focusSessions;
  document.getElementById('session-count').textContent =
    total + ' session' + (total !== 1 ? 's' : '') + ' today';
}

function updateSettingDisplays() {
  document.getElementById('val-focus').textContent    = settings.focus;
  document.getElementById('val-short').textContent    = settings.short;
  document.getElementById('val-long').textContent     = settings.long;
  document.getElementById('val-interval').textContent = settings.interval;
}

// ── Timer control ─────────────────────────────────────────────────────────────
function startTimer() {
  if (running) return;
  running = true;
  document.getElementById('btn-start').textContent = 'Pause';
  timer = setInterval(tick, 1000);
}

function pauseTimer() {
  running = false;
  clearInterval(timer); timer = null;
  document.getElementById('btn-start').textContent = 'Resume';
}

function tick() {
  timeLeft--;
  updateDisplay();
  if (timeLeft <= 0) sessionComplete();
}

function sessionComplete() {
  pauseTimer();
  // Notify
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(mode === 'focus' ? '✓ Focus session done! Time for a break.' : '◷ Break over. Back to focus!');
  }
  // Update stats
  if (mode === 'focus') {
    stats.focusSessions++;
    stats.minutesFocused += settings.focus;
    sessionsThisCycle++;
    dotsHistory.push('focus');
  } else {
    stats.breaks++;
    dotsHistory.push(mode);
  }
  saveStats(); updateStats(); updateDots();

  // Auto-advance mode
  if (mode === 'focus') {
    if (sessionsThisCycle >= settings.interval) {
      sessionsThisCycle = 0;
      switchMode('long');
      toast('🎉 Great work! Time for a long break.');
    } else {
      switchMode('short');
      toast('✓ Session done! Take a short break.');
    }
  } else {
    switchMode('focus');
    toast('Break over — let\'s focus!');
  }
}

function resetTimer() {
  pauseTimer();
  timeLeft = totalTime;
  document.getElementById('btn-start').textContent = 'Start';
  updateDisplay();
}

function switchMode(m) {
  mode = m;
  const durations = { focus: settings.focus, short: settings.short, long: settings.long };
  totalTime = durations[m] * 60;
  timeLeft  = totalTime;
  running   = false;
  clearInterval(timer); timer = null;
  document.getElementById('btn-start').textContent = 'Start';
  updateModeChips(); updateDisplay(); updateDots();
}

// ── Event listeners ───────────────────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', () => {
  if (running) pauseTimer(); else startTimer();
  // Request notification permission on first start
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
});

document.getElementById('btn-reset').addEventListener('click', resetTimer);

document.getElementById('btn-skip').addEventListener('click', () => {
  pauseTimer();
  const next = mode === 'focus'
    ? (sessionsThisCycle + 1 >= settings.interval ? 'long' : 'short')
    : 'focus';
  switchMode(next);
});

// Mode chips
document.querySelectorAll('.mode-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    if (running) pauseTimer();
    switchMode(chip.dataset.mode);
  });
});

// Steppers
document.querySelectorAll('.step-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.setting;
    const dir = parseInt(btn.dataset.dir);
    const mins = { focus:[1,60], short:[1,30], long:[1,60], interval:[1,10] };
    const [min, max] = mins[key];
    settings[key] = Math.min(max, Math.max(min, settings[key] + dir));
    saveSettings(); updateSettingDisplays();
    // If changing current mode's duration, reset
    if (!running) {
      const durations = { focus: settings.focus, short: settings.short, long: settings.long };
      if (key !== 'interval' && key === mode) {
        totalTime = settings[key] * 60;
        timeLeft  = totalTime;
        updateDisplay();
      }
    }
  });
});

// ── Init ──────────────────────────────────────────────────────────────────────
updateSettingDisplays();
updateStats();
updateDots();
switchMode('focus');
</script>
</body>
</html>
