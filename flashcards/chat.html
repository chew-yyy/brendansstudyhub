<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#242424; --surf:#2e2e2e; --surf2:#363636; --surf3:#404040;
  --bdr:#484848; --bdr2:#585858;
  --txt:#f0f0f0; --txt2:#a0a0a0; --txt3:#606060;
  --acc:#e8e8e8; --green:#6abf7b; --red:#d96b6b; --blue:#6b9fd4; --amber:#d4a96b; --purple:#a78fd4;
  --shadow:rgba(0,0,0,0.5);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:'IBM Plex Mono',monospace}
.shell{height:100vh;display:flex;flex-direction:column}

/* ── Topbar ── */
.topbar{height:52px;border-bottom:1px solid var(--bdr);padding:0 16px;display:flex;align-items:center;gap:10px;background:var(--surf);flex-shrink:0}
.back-btn{background:none;border:1px solid var(--bdr);border-radius:3px;color:var(--txt2);font-size:0.8rem;width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:all .15s;text-decoration:none;flex-shrink:0}
.back-btn:hover{border-color:var(--bdr2);color:var(--txt)}
.topbar-title{font-family:'Syne',sans-serif;font-size:0.9rem;font-weight:700;flex:1}
.model-badge{font-size:0.57rem;letter-spacing:1px;text-transform:uppercase;color:var(--txt3);border:1px solid var(--bdr);border-radius:20px;padding:3px 9px}
.clear-btn{background:none;border:1px solid var(--bdr);border-radius:3px;color:var(--txt3);font-size:0.65rem;letter-spacing:1px;text-transform:uppercase;padding:5px 10px;cursor:pointer;transition:all .15s;font-family:'IBM Plex Mono',monospace}
.clear-btn:hover{border-color:var(--bdr2);color:var(--txt)}

/* ── System prompt bar ── */
.persona-bar{padding:8px 16px;border-bottom:1px solid var(--bdr);background:var(--surf);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.persona-bar::-webkit-scrollbar{display:none}
.persona-chip{font-family:'IBM Plex Mono',monospace;font-size:0.64rem;padding:4px 12px;border-radius:20px;border:1px solid var(--bdr);background:var(--surf2);color:var(--txt2);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.persona-chip:hover{border-color:var(--bdr2);color:var(--txt)}
.persona-chip.active{background:var(--purple);border-color:var(--purple);color:#fff;font-weight:500}

/* ── Messages ── */
.messages{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}

/* Welcome screen */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:16px;text-align:center;padding:32px 16px;color:var(--txt3)}
.welcome-icon{font-size:2.4rem;margin-bottom:4px}
.welcome-title{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;color:var(--txt);margin-bottom:4px}
.welcome-sub{font-size:0.72rem;color:var(--txt2);line-height:1.7;max-width:320px}
.suggestion-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:480px;margin-top:8px}
.suggestion{background:var(--surf);border:1px solid var(--bdr);border-radius:6px;padding:10px 12px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s;font-family:'IBM Plex Mono',monospace}
.suggestion:hover{border-color:var(--bdr2);background:var(--surf2)}
.suggestion-label{font-size:0.6rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--txt3);margin-bottom:3px}
.suggestion-text{font-size:0.7rem;color:var(--txt2);line-height:1.4}

/* Message bubbles */
.msg{display:flex;gap:10px;animation:msgIn .18s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}
.msg-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;margin-top:2px}
.msg.assistant .msg-avatar{background:var(--purple);color:#fff}
.msg.user .msg-avatar{background:var(--surf3);color:var(--txt2);border:1px solid var(--bdr)}
.msg-bubble{max-width:75%;padding:10px 14px;border-radius:6px;font-size:0.78rem;line-height:1.6}
.msg.assistant .msg-bubble{background:var(--surf);border:1px solid var(--bdr);color:var(--txt);border-bottom-left-radius:2px}
.msg.user .msg-bubble{background:var(--surf3);border:1px solid var(--bdr2);color:var(--txt);border-bottom-right-radius:2px}

/* Markdown inside bubbles */
.msg-bubble p{margin-bottom:8px}
.msg-bubble p:last-child{margin-bottom:0}
.msg-bubble code{background:var(--surf3);border:1px solid var(--bdr);border-radius:3px;padding:1px 5px;font-size:0.85em;font-family:'IBM Plex Mono',monospace;color:var(--blue)}
.msg-bubble pre{background:var(--surf3);border:1px solid var(--bdr);border-radius:4px;padding:10px 12px;overflow-x:auto;margin:8px 0}
.msg-bubble pre code{background:none;border:none;padding:0;color:var(--txt2)}
.msg-bubble strong{color:var(--txt);font-weight:600}
.msg-bubble em{color:var(--txt2)}
.msg-bubble ul,.msg-bubble ol{padding-left:18px;margin:6px 0}
.msg-bubble li{margin-bottom:3px}
.msg-bubble h1,.msg-bubble h2,.msg-bubble h3{font-family:'Syne',sans-serif;font-weight:700;margin:10px 0 5px}
.msg-bubble h1{font-size:1rem}
.msg-bubble h2{font-size:0.9rem}
.msg-bubble h3{font-size:0.82rem;color:var(--txt2)}
.msg-bubble blockquote{border-left:2px solid var(--bdr2);padding-left:10px;color:var(--txt2);margin:6px 0}
.msg-bubble a{color:var(--blue);text-decoration:none}
.msg-bubble a:hover{text-decoration:underline}

/* Typing indicator */
.typing{display:flex;gap:4px;align-items:center;padding:12px 14px}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--txt3);animation:typingBounce 1.2s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* ── Input area ── */
.input-area{border-top:1px solid var(--bdr);background:var(--surf);padding:12px 16px;padding-bottom:calc(12px + var(--safe-bottom));flex-shrink:0}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-box{font-family:'IBM Plex Mono',monospace;font-size:0.78rem;padding:10px 12px;border:1px solid var(--bdr);background:var(--surf2);color:var(--txt);border-radius:6px;outline:none;flex:1;resize:none;transition:border-color .15s;line-height:1.5;max-height:160px;overflow-y:auto;-webkit-appearance:none}
.input-box:focus{border-color:var(--purple)}
.input-box::placeholder{color:var(--txt3)}
.send-btn{background:var(--purple);border:none;border-radius:6px;color:#fff;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;font-size:0.9rem}
.send-btn:hover{background:#9070c4}
.send-btn:disabled{opacity:.35;cursor:not-allowed}
.input-hint{font-size:0.58rem;color:var(--txt3);margin-top:6px;text-align:center}

/* ── No token state ── */
.no-token{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;text-align:center;padding:32px 20px}
.no-token-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;color:var(--txt)}
.no-token-sub{font-size:0.72rem;color:var(--txt2);line-height:1.7;max-width:320px}
.no-token a{color:var(--blue);text-decoration:none}

/* Mobile */
@media(max-width:600px){
  .topbar{height:48px;padding:0 12px}
  .msg-bubble{max-width:88%}
  .suggestion-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <a class="back-btn" href="index.html">←</a>
    <div class="topbar-title">AI Chat</div>
    <div class="model-badge">Claude Sonnet</div>
    <button class="clear-btn" id="btn-clear">Clear</button>
  </div>

  <div class="persona-bar">
    <button class="persona-chip active" data-persona="general">General</button>
    <button class="persona-chip" data-persona="tutor">Study Tutor</button>
    <button class="persona-chip" data-persona="essay">Essay Helper</button>
    <button class="persona-chip" data-persona="flashcard">Flashcard Gen</button>
    <button class="persona-chip" data-persona="planner">Study Planner</button>
    <button class="persona-chip" data-persona="math">Math Solver</button>
    <button class="persona-chip" data-persona="code">Code Helper</button>
  </div>

  <div class="messages" id="messages">
    <!-- welcome shown by JS -->
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea class="input-box" id="input-box" placeholder="Ask anything…" rows="1"></textarea>
      <button class="send-btn" id="send-btn" title="Send">↑</button>
    </div>
    <div class="input-hint">Enter to send · Shift+Enter for new line</div>
  </div>

</div>

<script>
// ── Personas ──────────────────────────────────────────────────────────────────
const PERSONAS = {
  general:    { label:'General', prompt:'You are a helpful, concise AI assistant. Format responses clearly using markdown where helpful.' },
  tutor:      { label:'Study Tutor', prompt:'You are an expert study tutor. Explain concepts clearly, use examples, check understanding, and encourage the student. Break down complex topics step by step. Use markdown for structure.' },
  essay:      { label:'Essay Helper', prompt:'You are an expert essay writing coach. Help with structure, argument clarity, introductions, conclusions, and language. Give specific, actionable feedback. Be constructive and encouraging.' },
  flashcard:  { label:'Flashcard Gen', prompt:'You are a flashcard generator. When given a topic or text, create concise question/answer flashcard pairs in this exact format:\n\nQ: [question]\nA: [answer]\n\nMake cards specific, clear, and testable. Generate 5-10 cards per request unless asked otherwise.' },
  planner:    { label:'Study Planner', prompt:'You are a study planner assistant. Help create realistic study schedules, break large tasks into manageable chunks, suggest study techniques (Pomodoro, spaced repetition, active recall), and help prioritise tasks. Ask clarifying questions about deadlines and workload.' },
  math:       { label:'Math Solver', prompt:'You are a patient math tutor. Show all working steps clearly. Explain each step in plain English. Use proper notation. Verify the answer at the end. If a student makes an error, gently point it out and guide them to the correct solution.' },
  code:       { label:'Code Helper', prompt:'You are an expert programming assistant. Write clean, well-commented code. Explain what the code does. Point out potential issues. Use code blocks with language syntax highlighting. Ask for clarification on language/framework if not specified.' }
};

// ── State ─────────────────────────────────────────────────────────────────────
let history = [];           // [{role, content}]
let activePersona = 'general';
let isStreaming = false;

// ── Markdown parser (lightweight) ────────────────────────────────────────────
function parseMarkdown(md) {
  let html = md
    // Escape HTML
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    // Code blocks
    .replace(/```(\w*)\n?([\s\S]*?)```/g,(_,lang,code)=>`<pre><code>${code.trim()}</code></pre>`)
    // Inline code
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    // Bold
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    // Italic
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    // Headers
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    // Blockquote
    .replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
    // Unordered list
    .replace(/^\s*[-*] (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
    // Ordered list
    .replace(/^\d+\. (.+)$/gm,'<li>$1</li>')
    // Links
    .replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank">$1</a>')
    // Paragraphs (double newline)
    .replace(/\n\n/g,'</p><p>')
    // Single newline → <br> inside paragraphs
    .replace(/\n/g,'<br>');

  // Wrap in paragraph if not starting with block element
  if(!html.startsWith('<h')||!html.startsWith('<pre')||!html.startsWith('<ul')||!html.startsWith('<blockquote')){
    html = `<p>${html}</p>`;
  }
  return html;
}

// ── Render welcome ────────────────────────────────────────────────────────────
const SUGGESTIONS = [
  { label:'Explain a concept', text:'Explain how photosynthesis works in simple terms' },
  { label:'Generate flashcards', text:'Create flashcards for the causes of World War 1' },
  { label:'Help with essay', text:'Help me write an introduction for an essay on climate change' },
  { label:'Study schedule', text:'I have a biology exam in 5 days — create a study plan' },
  { label:'Solve a problem', text:'Solve this step by step: 2x² + 5x - 3 = 0' },
  { label:'Explain code', text:'Explain what a recursive function is with an example' }
];

function showWelcome() {
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '';
  const w = document.createElement('div');
  w.className = 'welcome';
  w.innerHTML = `<div class="welcome-icon">◈</div>
    <div class="welcome-title">Study AI</div>
    <div class="welcome-sub">Ask me anything — from explaining concepts and solving problems, to generating flashcards and writing essays.</div>
    <div class="suggestion-grid" id="suggestion-grid"></div>`;
  msgs.appendChild(w);
  const grid = w.querySelector('#suggestion-grid');
  SUGGESTIONS.forEach(s => {
    const btn = document.createElement('div');
    btn.className = 'suggestion';
    btn.innerHTML = `<div class="suggestion-label">${s.label}</div><div class="suggestion-text">${s.text}</div>`;
    btn.addEventListener('click', () => { document.getElementById('input-box').value = s.text; sendMessage(); });
    grid.appendChild(btn);
  });
}

// ── Add message to UI ─────────────────────────────────────────────────────────
function addMessage(role, content, streaming=false) {
  const msgs = document.getElementById('messages');
  // Remove welcome if present
  const welcome = msgs.querySelector('.welcome');
  if (welcome) welcome.remove();

  const msg = document.createElement('div');
  msg.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'assistant' ? '◈' : 'U';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  if (role === 'assistant') {
    bubble.innerHTML = streaming ? '' : parseMarkdown(content);
  } else {
    bubble.textContent = content;
  }

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  msgs.appendChild(msg);
  msgs.scrollTop = msgs.scrollHeight;
  return bubble;
}

// ── Typing indicator ──────────────────────────────────────────────────────────
function showTyping() {
  const msgs = document.getElementById('messages');
  const msg = document.createElement('div');
  msg.className = 'msg assistant';
  msg.id = 'typing-indicator';
  msg.innerHTML = `<div class="msg-avatar">◈</div><div class="msg-bubble"><div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
  msgs.appendChild(msg);
  msgs.scrollTop = msgs.scrollHeight;
}
function hideTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

// ── Send message ──────────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('input-box');
  const text = input.value.trim();
  if (!text || isStreaming) return;

  input.value = '';
  autoResize(input);
  isStreaming = true;
  document.getElementById('send-btn').disabled = true;

  // Add user message
  history.push({ role: 'user', content: text });
  addMessage('user', text);
  showTyping();

  try {
    // Get API key from localStorage
    const apiKey = localStorage.getItem('anthropic_api_key') || '';
    if (!apiKey) {
      hideTyping();
      addMessage('assistant', '**No API key found.** Please add your Anthropic API key in [Settings](settings.html).\n\nGet a free key at [console.anthropic.com](https://console.anthropic.com).');
      isStreaming = false;
      document.getElementById('send-btn').disabled = false;
      return;
    }

    const response = await fetch('/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1500,
        system: PERSONAS[activePersona].prompt,
        messages: history,
        anthropic_api_key: apiKey
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || `API error ${response.status}`);
    }

    const data = await response.json();
    const assistantText = data.content?.find(b => b.type === 'text')?.text || '';

    hideTyping();
    addMessage('assistant', assistantText);
    history.push({ role: 'assistant', content: assistantText });

  } catch (err) {
    hideTyping();
    addMessage('assistant', `**Something went wrong:** ${err.message}\n\nCheck your API key in Settings, or make sure your Netlify deployment is live.`);
  }

  isStreaming = false;
  document.getElementById('send-btn').disabled = false;
  input.focus();
}

// ── Input auto-resize ─────────────────────────────────────────────────────────
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

const inputBox = document.getElementById('input-box');
inputBox.addEventListener('input', () => autoResize(inputBox));
inputBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

document.getElementById('send-btn').addEventListener('click', sendMessage);

// ── Persona chips ─────────────────────────────────────────────────────────────
document.querySelectorAll('.persona-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.persona-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activePersona = chip.dataset.persona;
    // If no messages yet, just switch. If mid-conversation, add a note.
    if (history.length > 0) {
      addMessage('assistant', `Switched to **${PERSONAS[activePersona].label}** mode. How can I help?`);
      history = []; // reset history for new persona
    }
  });
});

// ── Clear ─────────────────────────────────────────────────────────────────────
document.getElementById('btn-clear').addEventListener('click', () => {
  history = [];
  showWelcome();
});

// ── Init ──────────────────────────────────────────────────────────────────────
showWelcome();
inputBox.focus();
</script>
</body>
</html>
