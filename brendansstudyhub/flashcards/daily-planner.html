<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Daily Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#242424; --surf:#2e2e2e; --surf2:#363636; --surf3:#404040;
  --bdr:#484848; --bdr2:#585858;
  --txt:#f0f0f0; --txt2:#a0a0a0; --txt3:#606060;
  --green:#6abf7b; --red:#d96b6b; --blue:#6b9fd4; --amber:#d4a96b; --purple:#a78fd4; --orange:#d4906b;
  --shadow:rgba(0,0,0,0.5);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  /* Timeline */
  --hour-h: 64px;
  --time-col: 52px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:'IBM Plex Mono',monospace}
.shell{height:100vh;display:flex;flex-direction:column}

/* ── Topbar ── */
.topbar{height:52px;border-bottom:1px solid var(--bdr);padding:0 14px;display:flex;align-items:center;gap:8px;background:var(--surf);flex-shrink:0}
.back-btn{background:none;border:1px solid var(--bdr);border-radius:3px;color:var(--txt2);font-size:0.8rem;width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:all .15s;text-decoration:none;flex-shrink:0}
.back-btn:hover{border-color:var(--bdr2);color:var(--txt)}
.topbar-title{font-family:'Syne',sans-serif;font-size:0.9rem;font-weight:700;flex:1}
.date-nav{display:flex;align-items:center;gap:6px;flex-shrink:0}
.nav-btn{background:none;border:1px solid var(--bdr);border-radius:3px;color:var(--txt2);cursor:pointer;font-size:0.75rem;padding:4px 8px;font-family:'IBM Plex Mono',monospace;transition:all .15s}
.nav-btn:hover{border-color:var(--bdr2);color:var(--txt)}
.date-lbl{font-family:'Syne',sans-serif;font-size:0.8rem;font-weight:700;min-width:90px;text-align:center;cursor:pointer;transition:color .12s}
.date-lbl:hover{color:var(--blue)}
.add-btn{background:var(--blue);border:none;border-radius:3px;color:#fff;cursor:pointer;font-size:0.65rem;letter-spacing:1px;text-transform:uppercase;padding:6px 12px;font-family:'IBM Plex Mono',monospace;transition:background .15s;white-space:nowrap}
.add-btn:hover{background:#5a8ec3}

/* ── Day strip ── */
.day-strip{display:flex;border-bottom:1px solid var(--bdr);background:var(--surf);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.day-strip::-webkit-scrollbar{display:none}
.day-chip{flex:1;min-width:42px;padding:7px 4px;text-align:center;cursor:pointer;transition:background .12s;border-right:1px solid var(--bdr);position:relative;user-select:none}
.day-chip:last-child{border-right:none}
.day-chip:hover{background:var(--surf2)}
.day-chip.active{background:var(--surf3)}
.day-chip.today::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--blue)}
.day-chip .dn{font-size:0.5rem;text-transform:uppercase;letter-spacing:1px;color:var(--txt3);margin-bottom:3px}
.day-chip .dd{font-family:'Syne',sans-serif;font-size:0.9rem;font-weight:700;color:var(--txt)}
.day-chip.active .dd,.day-chip.today .dd{color:var(--blue)}

/* ── Main ── */
.main{flex:1;display:flex;overflow:hidden}

/* ── Timeline wrap ── */
.tl-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.tl-wrap.dragging-active{cursor:grabbing;user-select:none}

/* ── Timeline ── */
.timeline{position:relative;padding-left:var(--time-col)}

/* Hour rows */
.hour-row{position:absolute;left:var(--time-col);right:0;height:var(--hour-h);border-top:1px solid var(--bdr);pointer-events:none}
.hour-row.minor{border-top:1px dashed var(--bdr);opacity:.4}
.hour-lbl{position:absolute;right:calc(100% + 4px);top:-8px;width:calc(var(--time-col) - 4px);text-align:right;font-size:0.58rem;color:var(--txt3);letter-spacing:.3px;pointer-events:none;white-space:nowrap;font-family:'IBM Plex Mono',monospace}


/* Now line */
.now-line{position:absolute;left:var(--time-col);right:0;height:2px;background:var(--red);z-index:20;pointer-events:none}
.now-line::before{content:'';position:absolute;left:-6px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}

/* ── Event blocks ── */
.ev{position:absolute;left:calc(var(--time-col) + 4px);right:4px;border-radius:5px;padding:5px 10px 5px 9px;cursor:grab;overflow:hidden;transition:box-shadow .15s,filter .12s;z-index:10;border-left:3px solid transparent;user-select:none}
.ev:hover{filter:brightness(1.1)}
.ev.dragging{cursor:grabbing;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:50;opacity:.92;filter:brightness(1.15)}
.ev.done{opacity:.4}
.ev-title{font-family:'Syne',sans-serif;font-size:0.78rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:1px}
.ev-time{font-size:0.57rem;opacity:.85}
.ev-check{position:absolute;top:6px;right:7px;width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:0.6rem;cursor:pointer;flex-shrink:0;background:transparent;transition:background .12s}
.ev.done .ev-check{background:currentColor}
.ev.done .ev-check::after{content:'✓';color:var(--bg);font-weight:700}

/* Resize handle */
.ev-resize{position:absolute;bottom:0;left:0;right:0;height:8px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.ev:hover .ev-resize{opacity:1}
.ev-resize::before{content:'';width:24px;height:2px;background:currentColor;border-radius:1px;opacity:.5}

/* Drop ghost */
.drop-ghost{position:absolute;left:calc(var(--time-col) + 4px);right:4px;border-radius:5px;background:rgba(107,159,212,.15);border:2px dashed var(--blue);z-index:5;pointer-events:none;display:none}

/* Type colours */
.t-session{background:rgba(107,159,212,.18);border-color:var(--blue);color:var(--blue)}
.t-break{background:rgba(106,191,123,.18);border-color:var(--green);color:var(--green)}
.t-exam{background:rgba(217,107,107,.18);border-color:var(--red);color:var(--red)}
.t-personal{background:rgba(167,143,212,.18);border-color:var(--purple);color:var(--purple)}
.t-other{background:rgba(212,144,107,.18);border-color:var(--orange);color:var(--orange)}

/* Empty state */
.tl-empty{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--txt3);font-size:0.74rem;line-height:1.8;pointer-events:none;white-space:nowrap}

/* ── Sidebar ── */
.sidebar{width:180px;border-left:1px solid var(--bdr);background:var(--surf);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;padding-bottom:var(--safe-bottom)}
.sb-section{padding:12px 12px 8px;border-bottom:1px solid var(--bdr)}
.sb-label{font-size:0.56rem;text-transform:uppercase;letter-spacing:2px;color:var(--txt3);display:block;margin-bottom:8px}
.sb-stat{display:flex;justify-content:space-between;font-size:0.68rem;margin-bottom:5px}
.sb-stat-val{font-family:'Syne',sans-serif;font-weight:700}
.prog{height:3px;background:var(--surf3);border-radius:2px;overflow:hidden;margin-top:6px}
.prog-fill{height:100%;background:var(--blue);transition:width .4s;border-radius:2px}
.legend{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:0.67rem;color:var(--txt2);cursor:pointer;user-select:none}
.legend.muted{opacity:.3}
.ldot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.tmpl-btn{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:4px;cursor:pointer;font-size:0.67rem;color:var(--txt2);transition:background .12s;border:none;background:none;width:100%;font-family:'IBM Plex Mono',monospace;text-align:left}
.tmpl-btn:hover{background:var(--surf2);color:var(--txt)}

/* ── Modal ── */
.modal-back{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:300;align-items:flex-end;justify-content:center}
.modal-back.open{display:flex}
.modal{background:var(--surf);border:1px solid var(--bdr2);border-radius:10px 10px 0 0;padding:20px 18px calc(20px + var(--safe-bottom));width:100%;max-width:460px;animation:slideup .2s ease;box-shadow:0 -8px 32px var(--shadow)}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-family:'Syne',sans-serif;font-size:0.9rem;font-weight:700;margin-bottom:14px}
.mf{margin-bottom:9px}
.mf label{font-size:0.57rem;text-transform:uppercase;letter-spacing:2px;color:var(--txt3);display:block;margin-bottom:4px}
.mf input,.mf select,.mf textarea{font-family:'IBM Plex Mono',monospace;font-size:0.75rem;padding:7px 9px;border:1px solid var(--bdr);background:var(--surf2);color:var(--txt);border-radius:3px;outline:none;width:100%;-webkit-appearance:none;transition:border-color .15s}
.mf input:focus,.mf select:focus,.mf textarea:focus{border-color:var(--blue)}
.mf input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.5)}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-pills{display:flex;gap:4px;flex-wrap:wrap}
.tp{font-family:'IBM Plex Mono',monospace;font-size:0.61rem;padding:3px 9px;border-radius:20px;border:1px solid var(--bdr);background:var(--surf2);color:var(--txt2);cursor:pointer;transition:all .15s}
.tp:hover{border-color:var(--bdr2);color:var(--txt)}
.tp.as{background:rgba(107,159,212,.2);border-color:var(--blue);color:var(--blue)}
.tp.ab{background:rgba(106,191,123,.2);border-color:var(--green);color:var(--green)}
.tp.ae{background:rgba(217,107,107,.2);border-color:var(--red);color:var(--red)}
.tp.ap{background:rgba(167,143,212,.2);border-color:var(--purple);color:var(--purple)}
.tp.ao{background:rgba(212,144,107,.2);border-color:var(--orange);color:var(--orange)}
.macts{display:flex;gap:7px;margin-top:13px;justify-content:space-between;align-items:center}
.macts-r{display:flex;gap:7px}
.btn{font-family:'IBM Plex Mono',monospace;font-size:0.66rem;letter-spacing:1.5px;text-transform:uppercase;padding:7px 13px;border:1px solid #e8e8e8;background:#e8e8e8;color:#242424;cursor:pointer;border-radius:2px;transition:all .15s;font-weight:500}
.btn:hover{background:#a0a0a0;border-color:#a0a0a0}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.out{background:transparent;color:var(--txt2);border-color:var(--bdr2)}
.btn.out:hover{color:var(--txt);border-color:var(--txt);background:var(--surf2)}
.btn.del{background:transparent;border-color:var(--bdr);color:var(--txt3)}
.btn.del:hover{border-color:var(--red);color:var(--red)}
.btn.sm{padding:5px 10px;font-size:0.61rem}
.btn.gcal{background:#4285f4;border-color:#4285f4;color:#fff}
.btn.gcal:hover{background:#3b78e7;border-color:#3b78e7}
@media(min-width:681px){
  .modal-back{align-items:center}
  .modal{border-radius:6px;max-width:400px;padding:20px 22px;animation:fadein .18s ease}
  @keyframes fadein{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
}

/* Toast */
.toast{position:fixed;bottom:calc(20px + var(--safe-bottom));left:50%;transform:translateX(-50%);background:var(--surf2);border:1px solid var(--bdr2);border-radius:20px;padding:8px 18px;font-size:0.72rem;color:var(--txt2);z-index:9999;animation:fadeup .2s ease;pointer-events:none;white-space:nowrap}
.toast.ok{border-color:var(--green);color:var(--green)}
.toast.err{border-color:var(--red);color:var(--red)}
@keyframes fadeup{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* Snap tooltip */
.snap-tip{position:fixed;background:var(--surf3);border:1px solid var(--bdr2);border-radius:4px;padding:3px 8px;font-size:0.62rem;color:var(--txt2);z-index:999;pointer-events:none;display:none}

/* Mobile */
@media(max-width:680px){
  .sidebar{display:none}
  .topbar{height:48px;padding:0 10px;gap:6px}
  --hour-h:56px;
}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <a class="back-btn" href="index.html">←</a>
    <div class="topbar-title">Daily Planner</div>
    <div class="date-nav">
      <button class="nav-btn" id="btn-prev">◀</button>
      <div class="date-lbl" id="date-lbl" title="Click to go to today">Today</div>
      <button class="nav-btn" id="btn-next">▶</button>
    </div>
    <button class="add-btn" id="btn-add">+ Block</button>
  </div>

  <div class="day-strip" id="day-strip"></div>

  <div class="main">
    <!-- Timeline -->
    <div class="tl-wrap" id="tl-wrap">
      <div class="timeline" id="timeline">
        <div class="drop-ghost" id="drop-ghost"></div>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sb-section">
        <span class="sb-label">Today's Progress</span>
        <div class="sb-stat"><span style="color:var(--txt3)">Sessions</span><span class="sb-stat-val" id="s-sess">0</span></div>
        <div class="sb-stat"><span style="color:var(--txt3)">Focus</span><span class="sb-stat-val" id="s-focus">0m</span></div>
        <div class="sb-stat"><span style="color:var(--txt3)">Done</span><span class="sb-stat-val" id="s-done">0/0</span></div>
        <div class="prog"><div class="prog-fill" id="s-prog" style="width:0%"></div></div>
      </div>
      <div class="sb-section">
        <span class="sb-label">Filter</span>
        <div class="legend" data-t="session"><div class="ldot" style="background:var(--blue)"></div>Study</div>
        <div class="legend" data-t="break"><div class="ldot" style="background:var(--green)"></div>Break</div>
        <div class="legend" data-t="exam"><div class="ldot" style="background:var(--red)"></div>Exam</div>
        <div class="legend" data-t="personal"><div class="ldot" style="background:var(--purple)"></div>Personal</div>
        <div class="legend" data-t="other"><div class="ldot" style="background:var(--orange)"></div>Other</div>
      </div>
      <div class="sb-section">
        <span class="sb-label">Quick Add</span>
        <button class="tmpl-btn" data-tmpl="session">📚 Study Session</button>
        <button class="tmpl-btn" data-tmpl="break">☕ Break</button>
        <button class="tmpl-btn" data-tmpl="pomo">🍅 Pomodoro 25m</button>
        <button class="tmpl-btn" data-tmpl="lunch">🍽️ Lunch</button>
        <button class="tmpl-btn" data-tmpl="exercise">🏃 Exercise</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-back" id="modal-back">
  <div class="modal">
    <h3 id="m-title">New Block</h3>
    <div class="mf"><label>Title</label><input type="text" id="m-inp-title" placeholder="e.g. Study Session 1"></div>
    <div class="mg">
      <div class="mf"><label>Start</label><input type="time" id="m-start" value="09:00"></div>
      <div class="mf"><label>End</label><input type="time" id="m-end" value="10:00"></div>
    </div>
    <div class="mf"><label>Type</label>
      <div class="type-pills">
        <button class="tp as" data-t="session">📚 Study</button>
        <button class="tp" data-t="break">☕ Break</button>
        <button class="tp" data-t="exam">📝 Exam</button>
        <button class="tp" data-t="personal">⭐ Personal</button>
        <button class="tp" data-t="other">📌 Other</button>
      </div>
    </div>
    <div class="mf"><label>Notes</label><textarea id="m-notes" rows="2" placeholder="Optional notes…"></textarea></div>
    <div class="macts">
      <button class="btn del sm" id="m-del" style="display:none">Delete</button>
      <div class="macts-r">
        <button class="btn out sm" id="m-cancel">Cancel</button>
        <button class="btn gcal sm" id="m-gcal">📅 + Cal</button>
        <button class="btn sm" id="m-save">Save</button>
      </div>
    </div>
  </div>
</div>

<div class="snap-tip" id="snap-tip"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const STORE_KEY   = 'dp_events_v2';
const PLANNER_DB  = '63ab2daeab1b46c3a4a8cdc10cc0e947';
const NOTION_VER  = '2022-06-28';
const PROXY       = '/api/notion';

let NOTION_TOKEN = localStorage.getItem('fc_notion_token') || '';
const nhdr = () => ({ 'Authorization': `Bearer ${NOTION_TOKEN}`, 'Content-Type': 'application/json', 'Notion-Version': NOTION_VER });

async function nPost(path, body) {
  const r = await fetch(PROXY+`/v1${path}`, { method:'POST', headers:nhdr(), body:JSON.stringify(body) });
  if (!r.ok) { const e = await r.json(); throw new Error(e.message||r.status); }
  return r.json();
}
async function nPatch(path, body) {
  const r = await fetch(PROXY+`/v1${path}`, { method:'PATCH', headers:nhdr(), body:JSON.stringify(body) });
  if (!r.ok) { const e = await r.json(); throw new Error(e.message||r.status); }
  return r.json();
}
async function queryPlannerDB(dateStr) {
  const r = await nPost(`/databases/${PLANNER_DB}/query`, {
    filter: { property:'Date', date:{ equals: dateStr } },
    sorts: [{ property:'Start', direction:'ascending' }],
    page_size: 100
  });
  return (r.results||[]).map(p => ({
    id:    p.id,
    notionId: p.id,
    title: p.properties?.Title?.title?.[0]?.plain_text || '',
    start: p.properties?.Start?.rich_text?.[0]?.plain_text || '09:00',
    end:   p.properties?.End?.rich_text?.[0]?.plain_text   || '10:00',
    type:  (p.properties?.Type?.select?.name||'Session').toLowerCase(),
    done:  p.properties?.Done?.checkbox || false,
    notes: p.properties?.Notes?.rich_text?.[0]?.plain_text || '',
  }));
}

async function saveToNotion(ev, dateStr) {
  const props = {
    Title: { title:[{ text:{ content: ev.title } }] },
    Start: { rich_text:[{ text:{ content: ev.start } }] },
    End:   { rich_text:[{ text:{ content: ev.end } }] },
    Type:  { select:{ name: ev.type.charAt(0).toUpperCase()+ev.type.slice(1) } },
    Done:  { checkbox: ev.done||false },
    Notes: { rich_text: ev.notes ? [{ text:{ content: ev.notes } }] : [] },
    Date:  { date:{ start: dateStr } }
  };
  if (ev.notionId) {
    await nPatch(`/pages/${ev.notionId}`, { properties: props });
  } else {
    const p = await nPost('/pages', { parent:{ database_id: PLANNER_DB }, properties: props });
    ev.notionId = p.id;
  }
}

async function deleteFromNotion(notionId) {
  if (!notionId) return;
  await nPatch(`/pages/${notionId}`, { archived: true });
}

async function loadDayFromNotion(dateStr) {
  if (!NOTION_TOKEN) return null;
  try {
    return await queryPlannerDB(dateStr);
  } catch(e) { console.warn('Notion load failed:', e.message); return null; }
}
const START_H   = 6;
const END_H     = 23;
const HOUR_H    = 64; // px per hour — matches --hour-h
const MIN_H     = HOUR_H / 60;
const SNAP_MIN  = 5; // snap to 5-min grid

// ── State ─────────────────────────────────────────────────────────────────────
let store    = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
let curDate  = today0();
let editId   = null;
let mType    = 'session';
let hidden   = new Set();

const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const uid    = () => Math.random().toString(36).slice(2,10);
const esc    = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const COLORS = {session:'var(--blue)',break:'var(--green)',exam:'var(--red)',personal:'var(--purple)',other:'var(--orange)'};
const TMPL   = {
  session:  {title:'Study Session', type:'session', start:'09:00', end:'10:00'},
  break:    {title:'Break',         type:'break',   start:'10:00', end:'10:15'},
  pomo:     {title:'Pomodoro',      type:'session', start:'09:00', end:'09:25'},
  lunch:    {title:'Lunch',         type:'break',   start:'12:00', end:'13:00'},
  exercise: {title:'Exercise',      type:'personal',start:'17:00', end:'18:00'},
};

// ── Helpers ───────────────────────────────────────────────────────────────────
function today0() { const d=new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d,n) { const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function fmtKey(d) { return d.toISOString().split('T')[0]; }
function t2m(t) { const [h,m]=t.split(':').map(Number); return h*60+m; }
function m2t(m) { return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; }
function snapMin(m) { return Math.round(m/SNAP_MIN)*SNAP_MIN; }
function minToY(m) { return (m - START_H*60) * MIN_H; }
function yToMin(y) { return y/MIN_H + START_H*60; }

function toast(msg,type='') {
  const el=document.createElement('div'); el.className='toast'+(type?' '+type:''); el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(),2800);
}
function saveLocal() { localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
function getDay() { return store[fmtKey(curDate)] || []; }
function setDay(evs) { store[fmtKey(curDate)] = evs; saveLocal(); }

// ── Load day from Notion ──────────────────────────────────────────────────────
async function loadDay(dateStr) {
  const notionEvs = await loadDayFromNotion(dateStr);
  if (notionEvs) {
    store[dateStr] = notionEvs;
    saveLocal();
  }
  render();
}

// ── Day strip ─────────────────────────────────────────────────────────────────
function buildStrip() {
  const strip = document.getElementById('day-strip');
  strip.innerHTML='';
  const t = today0();
  for (let i=-3; i<=3; i++) {
    const d = addDays(t,i);
    const chip = document.createElement('div');
    const isT  = fmtKey(d)===fmtKey(t);
    const isA  = fmtKey(d)===fmtKey(curDate);
    chip.className = 'day-chip'+(isT?' today':'')+(isA?' active':'');
    chip.innerHTML = `<div class="dn">${DAYS[d.getDay()]}</div><div class="dd">${d.getDate()}</div>`;
    chip.addEventListener('click', ()=>{ curDate=d; window._hasScrolled=false; buildStrip(); loadDay(fmtKey(d)); });
    strip.appendChild(chip);
  }
}

// ── Date label ────────────────────────────────────────────────────────────────
function updateLabel() {
  const t=today0();
  const el=document.getElementById('date-lbl');
  const diff = Math.round((curDate-t)/(86400000));
  if(diff===0)      el.textContent='Today';
  else if(diff===1) el.textContent='Tomorrow';
  else if(diff===-1)el.textContent='Yesterday';
  else el.textContent=`${curDate.getDate()} ${MONTHS[curDate.getMonth()]}`;
}

// ── Render timeline ───────────────────────────────────────────────────────────
function render() {
  updateLabel();
  const tl = document.getElementById('timeline');
  // Remove events but keep ghost
  tl.querySelectorAll('.hour-row,.ev,.now-line').forEach(e=>e.remove());

  const totalH = END_H - START_H;
  tl.style.height = (totalH*HOUR_H + 32)+'px';

  // Hour + half-hour rows and labels
  for (let h=START_H; h<=END_H; h++) {
    // Full hour
    const row = document.createElement('div'); row.className='hour-row';
    row.style.top = ((h-START_H)*HOUR_H)+'px';
    const lbl12 = h===0?'12am':h<12?h+'am':h===12?'12pm':(h-12)+'pm';
    row.innerHTML = `<div class="hour-lbl">${lbl12}</div>`;
    tl.appendChild(row);

    // Half hour marker
    if (h < END_H) {
      const half = document.createElement('div'); half.className='hour-row minor';
      half.style.top = ((h-START_H)*HOUR_H + HOUR_H/2)+'px';
      tl.appendChild(half);
    }
  }

  // Now line
  const now=new Date();
  const nowMin=now.getHours()*60+now.getMinutes();
  if(fmtKey(curDate)===fmtKey(today0()) && nowMin>=START_H*60 && nowMin<=END_H*60) {
    const nl=document.createElement('div'); nl.className='now-line';
    nl.style.top=minToY(nowMin)+'px';
    tl.appendChild(nl);
    if (!window._hasScrolled) {
      window._hasScrolled = true;
      setTimeout(()=>{
        const wrap=document.getElementById('tl-wrap');
        wrap.scrollTop=Math.max(0,minToY(nowMin)-140);
      },60);
    }
  }

  // Events
  const evs=getDay().filter(e=>!hidden.has(e.type));
  evs.forEach(ev=>renderEvent(ev, tl));

  if(!evs.length) {
    const emp=document.createElement('div'); emp.className='tl-empty';
    emp.innerHTML='No blocks planned.<br>Click <strong>+ Block</strong> or tap the timeline.';
    tl.appendChild(emp);
  }

  updateSummary();
}

function renderEvent(ev, tl) {
  const sm = t2m(ev.start);
  const em = t2m(ev.end);
  const top = minToY(sm);
  const h   = Math.max(22, (em-sm)*MIN_H - 2);

  const el = document.createElement('div');
  el.className = `ev t-${ev.type}${ev.done?' done':''}`;
  el.style.cssText = `top:${top}px;height:${h}px`;
  el.dataset.id = ev.id;

  el.innerHTML = `
    <div class="ev-title">${esc(ev.title)}</div>
    <div class="ev-time">${ev.start} – ${ev.end}</div>
    <div class="ev-check"></div>
    <div class="ev-resize"></div>
  `;

  // Check done
  el.querySelector('.ev-check').addEventListener('mousedown', e=>e.stopPropagation());
  el.querySelector('.ev-check').addEventListener('click', e=>{ e.stopPropagation(); toggleDone(ev.id); });

  // Drag to move
  el.addEventListener('mousedown',  e=>startDrag(e, ev, 'move'));
  el.addEventListener('touchstart', e=>startDrag(e, ev, 'move'), {passive:false});

  // Resize
  el.querySelector('.ev-resize').addEventListener('mousedown',  e=>{ e.stopPropagation(); startDrag(e,ev,'resize'); });
  el.querySelector('.ev-resize').addEventListener('touchstart', e=>{ e.stopPropagation(); startDrag(e,ev,'resize'); }, {passive:false});

  // Click to edit (distinguished from drag later)
  el._didDrag = false;
  el.addEventListener('click', e=>{ if(!el._didDrag) openEdit(ev); });

  tl.appendChild(el);
}

// ── Drag & Drop ───────────────────────────────────────────────────────────────
function getClientY(e) { return e.touches ? e.touches[0].clientY : e.clientY; }

function startDrag(e, ev, mode) {
  if (e.target.closest('.ev-check')) return;
  if (mode==='move' && e.target.closest('.ev-resize')) return;
  e.preventDefault();

  const el = document.querySelector(`.ev[data-id="${ev.id}"]`);
  if (!el) return;
  el._didDrag = false;

  const wrap   = document.getElementById('tl-wrap');
  const tl     = document.getElementById('timeline');
  const ghost  = document.getElementById('drop-ghost');
  const tip    = document.getElementById('snap-tip');

  const startY  = getClientY(e);
  const origTop = parseFloat(el.style.top);
  const origH   = parseFloat(el.style.height);
  const sm      = t2m(ev.start);
  const em      = t2m(ev.end);
  const dur     = em - sm;

  ghost.style.height  = el.style.height;
  ghost.style.display = 'block';
  ghost.style.top     = el.style.top;

  wrap.classList.add('dragging-active');
  el.classList.add('dragging');
  tip.style.display = 'block';

  function onMove(ev2) {
    ev2.preventDefault();
    const dy   = getClientY(ev2) - startY;
    el._didDrag = el._didDrag || Math.abs(dy) > 3;

    if (mode === 'move') {
      const rawTop  = origTop + dy;
      const rawMin  = yToMin(rawTop);
      const snapS   = Math.max(START_H*60, Math.min(END_H*60-dur, snapMin(rawMin)));
      const snapE   = snapS + dur;
      const newTop  = minToY(snapS);

      el.style.top    = newTop+'px';
      ghost.style.top = newTop+'px';
      tip.textContent = `${m2t(snapS)} – ${m2t(snapE)}`;
      tip.style.left  = (getClientY(ev2)+(ev2.touches?0:12))+'px';
      tip.style.top   = (getClientY(ev2)-(ev2.touches?32:12))+'px';

      el._snapStart = snapS; el._snapEnd = snapE;
    } else {
      // resize
      const newH    = Math.max(SNAP_MIN*MIN_H, origH+dy);
      const rawEnd  = yToMin(origTop+newH);
      const snapE   = Math.min(END_H*60, snapMin(rawEnd));
      const finalH  = Math.max(SNAP_MIN*MIN_H, minToY(snapE)-origTop);

      el.style.height    = finalH+'px';
      ghost.style.height = finalH+'px';
      tip.textContent    = `${ev.start} – ${m2t(snapE)}`;
      tip.style.left     = (getClientY(ev2)+(ev2.touches?0:12))+'px';
      tip.style.top      = (getClientY(ev2)-(ev2.touches?32:12))+'px';

      el._snapEnd = snapE;
    }
  }

  function onUp() {
    document.removeEventListener('mousemove',  onMove);
    document.removeEventListener('mouseup',    onUp);
    document.removeEventListener('touchmove',  onMove);
    document.removeEventListener('touchend',   onUp);

    el.classList.remove('dragging');
    wrap.classList.remove('dragging-active');
    ghost.style.display = 'none';
    tip.style.display   = 'none';

    if (!el._didDrag) return;

    // Commit
    const evs = getDay();
    const target = evs.find(e=>e.id===ev.id);
    if (target) {
      if (mode==='move' && el._snapStart != null) {
        target.start = m2t(el._snapStart);
        target.end   = m2t(el._snapEnd);
      } else if (mode==='resize' && el._snapEnd != null) {
        target.end = m2t(el._snapEnd);
      }
      setDay(evs);
      // Sync to Notion
      if(target.notionId && NOTION_TOKEN) {
        saveToNotion(target, fmtKey(curDate)).catch(e=>console.warn('Notion sync failed:',e.message));
      }
    }
    render();
  }

  document.addEventListener('mousemove',  onMove);
  document.addEventListener('mouseup',    onUp);
  document.addEventListener('touchmove',  onMove, {passive:false});
  document.addEventListener('touchend',   onUp);
}

// ── Summary ───────────────────────────────────────────────────────────────────
function updateSummary() {
  const evs = getDay();
  const sess = evs.filter(e=>e.type==='session');
  const fm   = sess.reduce((a,e)=>a+(t2m(e.end)-t2m(e.start)),0);
  const done = evs.filter(e=>e.done).length;
  const tot  = evs.length;
  const pct  = tot ? Math.round(done/tot*100) : 0;
  document.getElementById('s-sess').textContent  = sess.length;
  document.getElementById('s-focus').textContent = fm>=60?`${Math.floor(fm/60)}h${fm%60?` ${fm%60}m`:''}`:`${fm}m`;
  document.getElementById('s-done').textContent  = `${done}/${tot}`;
  document.getElementById('s-prog').style.width  = pct+'%';
}

function toggleDone(id) {
  const evs=getDay(); const ev=evs.find(e=>e.id===id);
  if(ev){
    ev.done=!ev.done; setDay(evs); render();
    if(ev.notionId && NOTION_TOKEN) {
      nPatch(`/pages/${ev.notionId}`, { properties:{ Done:{ checkbox: ev.done } } })
        .catch(e=>console.warn('Notion sync failed:',e.message));
    }
  }
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function setMType(t) {
  mType=t;
  const cls={session:'as',break:'ab',exam:'ae',personal:'ap',other:'ao'};
  document.querySelectorAll('.tp').forEach(p=>{
    p.className='tp'; if(p.dataset.t===t) p.classList.add(cls[t]);
  });
}

function openAdd(pre={}) {
  editId=null;
  document.getElementById('m-title').textContent='New Block';
  document.getElementById('m-inp-title').value=pre.title||'';
  document.getElementById('m-start').value=pre.start||'09:00';
  document.getElementById('m-end').value=pre.end||'10:00';
  document.getElementById('m-notes').value='';
  document.getElementById('m-del').style.display='none';
  setMType(pre.type||'session');
  document.getElementById('modal-back').classList.add('open');
  setTimeout(()=>document.getElementById('m-inp-title').focus(),80);
}

function openEdit(ev) {
  editId=ev.id;
  document.getElementById('m-title').textContent='Edit Block';
  document.getElementById('m-inp-title').value=ev.title;
  document.getElementById('m-start').value=ev.start;
  document.getElementById('m-end').value=ev.end;
  document.getElementById('m-notes').value=ev.notes||'';
  document.getElementById('m-del').style.display='';
  setMType(ev.type);
  document.getElementById('modal-back').classList.add('open');
}

function closeModal() { document.getElementById('modal-back').classList.remove('open'); }

function getForm() {
  return {
    title: document.getElementById('m-inp-title').value.trim(),
    start: document.getElementById('m-start').value,
    end:   document.getElementById('m-end').value,
    notes: document.getElementById('m-notes').value.trim(),
    type:  mType,
  };
}

function commitSave(data) {
  if(!data.title){ toast('Enter a title','err'); return false; }
  const evs=getDay();
  let ev;
  if(editId) {
    const i=evs.findIndex(e=>e.id===editId);
    if(i>-1){ evs[i]={...evs[i],...data}; ev=evs[i]; }
  } else {
    ev={id:uid(),done:false,...data};
    evs.push(ev);
  }
  setDay(evs); render(); closeModal();
  // Sync to Notion in background
  if(ev && NOTION_TOKEN) {
    saveToNotion(ev, fmtKey(curDate)).then(()=>{
      setDay(evs); // update notionId
    }).catch(e=>console.warn('Notion sync failed:',e.message));
  }
  return true;
}

document.getElementById('m-save').addEventListener('click', ()=>{ if(commitSave(getForm())) toast('Saved ✓','ok'); });
document.getElementById('m-cancel').addEventListener('click', closeModal);
document.getElementById('modal-back').addEventListener('click', e=>{ if(e.target===document.getElementById('modal-back')) closeModal(); });
document.getElementById('m-inp-title').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('m-save').click(); });
document.querySelectorAll('.tp').forEach(p=>p.addEventListener('click',()=>setMType(p.dataset.t)));

document.getElementById('m-del').addEventListener('click', ()=>{
  const evs=getDay();
  const ev=evs.find(e=>e.id===editId);
  setDay(evs.filter(e=>e.id!==editId));
  render(); closeModal(); toast('Block deleted');
  if(ev?.notionId && NOTION_TOKEN) {
    deleteFromNotion(ev.notionId).catch(e=>console.warn('Notion delete failed:',e.message));
  }
});

document.getElementById('m-gcal').addEventListener('click', async ()=>{
  const data=getForm();
  if(!commitSave(data)) return;
  const dateStr=fmtKey(curDate);
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  try {
    const r=await fetch('/api/calendar/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      summary:data.title, description:data.notes||undefined,
      start:{dateTime:`${dateStr}T${data.start}:00`,timeZone:tz},
      end:{dateTime:`${dateStr}T${data.end}:00`,timeZone:tz}
    })});
    if(!r.ok) throw new Error();
    toast('Added to Google Calendar ✓','ok');
  } catch(e){ toast('Saved locally (Calendar sync failed)'); }
});

// ── Click timeline to add ─────────────────────────────────────────────────────
document.getElementById('timeline').addEventListener('click', e=>{
  if(e.target.closest('.ev')) return;
  const tl=document.getElementById('timeline');
  const rect=tl.getBoundingClientRect();
  const y=e.clientY-rect.top;
  const rawMin=yToMin(y);
  const s=snapMin(Math.max(START_H*60,Math.min(END_H*60-60,rawMin)));
  openAdd({start:m2t(s),end:m2t(s+60)});
});

// ── Legend filter ─────────────────────────────────────────────────────────────
document.querySelectorAll('.legend').forEach(l=>{
  l.addEventListener('click',()=>{
    const t=l.dataset.t;
    hidden.has(t)?hidden.delete(t):hidden.add(t);
    l.classList.toggle('muted',hidden.has(t));
    render();
  });
});

// ── Quick add ─────────────────────────────────────────────────────────────────
document.querySelectorAll('.tmpl-btn').forEach(b=>b.addEventListener('click',()=>openAdd(TMPL[b.dataset.tmpl]||{})));

// ── Nav ───────────────────────────────────────────────────────────────────────
document.getElementById('btn-prev').addEventListener('click',()=>{ curDate=addDays(curDate,-1); window._hasScrolled=false; buildStrip(); loadDay(fmtKey(curDate)); });
document.getElementById('btn-next').addEventListener('click',()=>{ curDate=addDays(curDate,1);  window._hasScrolled=false; buildStrip(); loadDay(fmtKey(curDate)); });
document.getElementById('date-lbl').addEventListener('click',()=>{ curDate=today0(); window._hasScrolled=false; buildStrip(); loadDay(fmtKey(curDate)); });
document.getElementById('btn-add').addEventListener('click',()=>openAdd());

// ── Auto-refresh now line ─────────────────────────────────────────────────────
setInterval(()=>{ if(fmtKey(curDate)===fmtKey(today0())) render(); }, 60000);

// ── Init ──────────────────────────────────────────────────────────────────────
buildStrip();
loadDay(fmtKey(curDate));
</script>
